name: Build Android APK & Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK (.apk)
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt

      - name: Build Release APK (.apk)
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee -a build_log.txt

      - name: Build Release Bundle (.aab)
        run: |
          ./gradlew bundleRelease --stacktrace --no-daemon 2>&1 | tee -a build_log.txt

      - name: Print Failure Summary to GitHub
        if: failure()
        run: |
          echo "### ❌ Build Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 build_log.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: build_log.txt

      - name: Upload APKs (BlueStacks / Sideloading)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eduhub-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eduhub-release-aab
          path: app/build/outputs/bundle/release/*.aab

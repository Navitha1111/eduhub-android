name: Build Android APK & Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK (.apk)
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build_log.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Build Release APK (.apk)
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee -a build_log.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Build Release Bundle (.aab)
        run: |
          ./gradlew bundleRelease --stacktrace --no-daemon 2>&1 | tee -a build_log.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload APKs (BlueStacks / Sideloading)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eduhub-apks
          path: app/build/outputs/apk/**/*.apk

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: eduhub-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' && success()
        with:
          tag_name: v1.0.0-vps
          name: "EDUHUB Android v1.0.0 (VPS Cloud Connected)"
          body: |
            ### 🎓 EDUHUB Android v1.0.0 — VPS Cloud Edition
            Direct download binaries ready for BlueStacks, mobile devices, and Google Play Store:

            - 📱 **`app-debug.apk`** — Ready to drag & drop straight into BlueStacks or install on any Android phone (pre-signed).
            - 📦 **`app-release.aab`** — Android App Bundle ready to upload to Google Play Console.
            
            #### 🌟 Features:
            - **Connected to VPS Backend** (`http://162.35.9.208:8080`)
            - **Online Student Registration & Authentication**
            - **Live XP & Progress Cloud Sync**
            - **Tamper-Evident SHA-256 Certificate System** with AI Commendations & Public Verification
            - **39 Programming Languages** from 0 to Advanced
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab

      - name: Save Log to Branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          git add build_log.txt
          git commit -m "build log output [skip ci]" || echo "No changes"
          git push origin build-logs --force || echo "Could not push to branch"
